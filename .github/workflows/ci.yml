name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-and-dependencies:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Установка инструментов безопасности
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 4. SAST - Поиск уязвимостей в коде (Bandit)
        run: bandit -r . -x ./.venv* -f screen

      - name: 5. Dependency Audit - Проверка библиотек (pip-audit)
        # Игнорируем уязвимости (CVE), так как обновление ломает llm-guard.
        # Риск принят (Risk Accepted) до выхода патча от разработчиков llm-guard.
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-mr8g-6g6h-9h3q \
            --ignore-vuln PYSEC-2026-217 \
            --ignore-vuln PYSEC-2026-1986 \
            --ignore-vuln PYSEC-2026-1977 \
            --ignore-vuln PYSEC-2026-1983 \
            --ignore-vuln PYSEC-2026-1981 \
            --ignore-vuln PYSEC-2026-1980 \
            --ignore-vuln PYSEC-2026-1900 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-214 \
            --ignore-vuln PYSEC-2026-218 \
            --ignore-vuln PYSEC-2026-211 \
            --ignore-vuln PYSEC-2026-210 \
            --ignore-vuln PYSEC-2026-213 \
            --ignore-vuln PYSEC-2026-215 \
            --ignore-vuln PYSEC-2026-216 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-1984 \
            --ignore-vuln PYSEC-2026-1988 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929 \
            --ignore-vuln PYSEC-2026-4174 \
            --ignore-vuln PYSEC-2026-2141 \
            --ignore-vuln PYSEC-2026-35 \
            --ignore-vuln PYSEC-2026-3547 \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-and-dependencies
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Сборка Docker-образа
        run: docker build -t ai-security-lab:latest .

      - name: 3. Сканирование образа на уязвимости (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-security-lab:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'