name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast-and-dependencies:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Установка инструментов безопасности
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: 4. Запуск Unit-тестов (pytest)
        run: pytest test_security.py -v

      - name: 5. SAST - Поиск уязвимостей в коде (Bandit)
      # Исключаем тестовые файлы (test_*), так как использование assert в тестах безопасно
        run: bandit -r . -x ./.venv*,./test_*.py -f screen

      - name: 6. Dependency Audit - Проверка библиотек (pip-audit)
        continue-on-error: true  # <--- ВОТ ЭТО
        run: pip-audit -r requirements.txt

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-and-dependencies
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Сборка Docker-образа
        run: docker build -t ai-security-lab:latest .

      - name: 3. Сканирование образа на уязвимости (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-security-lab:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'