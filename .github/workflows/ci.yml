name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Ограничиваем права токена (Принцип наименьших привилегий)
permissions:
  contents: read

jobs:
  sast-and-dependencies:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Установка инструментов безопасности
        run: |
          python -m pip install --upgrade pip
          # 🔒 ДОБАВЛЕНО: pytest-asyncio для тестирования асинхронного LLM-судьи
          pip install bandit pip-audit pytest pytest-asyncio
          pip install -r requirements.txt

      - name: 4. Запуск Unit-тестов (pytest)
        run: pytest test_security.py -v

      - name: 5. SAST - Поиск уязвимостей в коде (Bandit)
        run: bandit -r . -x ./.venv*,./test_*.py -f screen

      - name: 6. Dependency Audit - Проверка библиотек (pip-audit)
        # 🔒 ЗАЩИТА: Блокирует сборку при НОВЫХ уязвимостях.
        # Скрипт читает .pip-audit-ignore, убирает комментарии, пустые строки и \r,
        # и формирует строку с флагами --ignore-vuln для каждой уязвимости.
        run: |
          IGNORE_ARGS=$(grep -v '^#' .pip-audit-ignore | grep -v '^$' | tr -d '\r' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          
          echo "=== Сгенерированные аргументы игнорирования ==="
          echo "$IGNORE_ARGS"
          echo "=============================================="
          
          pip-audit -r requirements.txt --no-deps $IGNORE_ARGS

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-and-dependencies
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Сборка Docker-образа
        run: docker build -t ai-security-lab:latest .

      - name: 3. Сканирование образа на уязвимости (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-security-lab:latest'
          format: 'table'
          exit-code: '1' # 🔒 ЗАЩИТА: Trivy роняет пайплайн при обнаружении CRITICAL/HIGH угроз
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'