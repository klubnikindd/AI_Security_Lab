name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ЗАДАЧА 1: Статический анализ (SAST) и проверка зависимостей
  sast-and-dependencies:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Установка инструментов безопасности
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 4. SAST: Поиск уязвимостей в коде (Bandit)
        # Bandit ищет небезопасные конструкции в Python-коде
        run: bandit -r . -x ./.venv* -f screen

      - name: 5. Dependency Audit: Проверка библиотек (pip-audit)
        # pip-audit проверяет requirements.txt на известные CVE
        run: pip-audit -r requirements.txt

  # ЗАДАЧА 2: Сканирование Docker-образа
  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-and-dependencies # Запустится только если первая задача прошла успешно
    
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Сборка Docker-образа
        run: docker build -t ai-security-lab:latest .

      - name: 3. Сканирование образа на уязвимости (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-security-lab:latest'
          format: 'table'
          exit-code: '0' # '0' означает, что пайплайн не упадет, а просто покажет отчет. Если поставить '1', то упадет при найденных Critical CVE.
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'