services:
  ollama:
    image: ollama/ollama:0.3.12 # 🔒 Зафиксирована версия
    container_name: ollama_server
    ports:
      - "127.0.0.1:11434:11434" # 🔒 Только localhost
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - monitoring

  gateway:
    build: .
    container_name: secure_gateway
    environment:
      - OLLAMA_HOST=http://ollama-exporter:8000
      - HF_HOME=/app/.cache/huggingface 
    volumes:
      - ./hf_cache:/app/.cache/huggingface 
    ports:
      - "127.0.0.1:8000:8000" # 🔒 Только localhost
    depends_on:
      - ollama
    networks:
      - monitoring

  ollama-exporter:
    build:
      context: .
      dockerfile: Dockerfile.exporter
    container_name: ollama_exporter
    environment:
      - OLLAMA_URL=http://ollama:11434
    networks:
      - monitoring
    depends_on:
      - ollama
    # Порт наружу не публикуется (по умолчанию), доступен только внутри сети monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.53.0 # 🔒 Зафиксирована версия
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090" # 🔒 Только localhost
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  grafana: # 🔒 ИСПРАВЛЕНО: Теперь ровно 2 пробела в начале!
    image: grafana/grafana:11.1.0 # 🔒 Зафиксирована версия
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000" # 🔒 Только localhost
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 🔒 ИСПРАВЛЕНО: Строгий Fail-Closed (без :-admin). 
      # Если .env нет или пароль не задан, контейнер упадет с ошибкой.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Ошибка: Вы должны задать GRAFANA_ADMIN_PASSWORD в .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge